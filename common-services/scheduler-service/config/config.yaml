service_name: scheduler-service
snapshot_table: schedule_requests
description: "Recurring schedules (every N minutes, daily at, any cron line in a timezone) that emit ticks to target services; pause, resume, run now, next times, tick history. Keywords: cron, job, reminder, timer, schedule"
project: platform
owns: [schedules, scheduler_health]  # tables this service is the system of record for (kept in its own database)
tables:            # created in this service's own database by setup.sh (table: [indexed fields])
  schedules: [target_service, tenant_id, owner]
  scheduler_health: []
on_start: ticker.start   # the background ticker that turns schedules into tick rows
